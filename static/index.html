<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Voice Bot for Smart Business Automation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at 15% 15%, #0f172a 0%, #030712 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .app-layout {
            width: 100%;
            max-width: 1100px;
        }

        /* Header */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 20px 24px;
            border-radius: 18px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand h2 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }

        .brand p {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .logo-icon {
            font-size: 2.2rem;
        }

        .system-tag {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .live-dot {
            width: 9px;
            height: 9px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        /* Selector Bar */
        .selector-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .selector-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .selector-content label {
            font-size: 0.92rem;
            color: #cbd5e1;
            white-space: nowrap;
        }

        .selector-content select {
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 600;
            outline: none;
            flex: 1;
            cursor: pointer;
        }

        .btn-voice-connect {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
        }

        /* Grid */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        @media (max-width: 860px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            .selector-card {
                flex-direction: column;
                align-items: stretch;
            }
        }

        .panel-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .panel-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f8fafc;
        }

        .state-idle {
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
